{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="login-card">
  <img class="login-logo" src="{% static 'img/logo_isac.png' %}" alt="ISAC - Instituto Saúde e Cidadania">
  <div class="text-center">
    <h1 class="login-titulo">Controle de notificações do DET</h1>
    <p class="login-sub">Entre com seu usuário e senha</p>
  </div>
  <form method="post" class="login-form">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100 mt-2">Entrar</button>
  </form>
  <p class="login-rodape">Acesso restrito a colaboradores do ISAC</p>
</div>
{% endblock %}
