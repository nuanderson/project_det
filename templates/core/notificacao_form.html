{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
  <h1 class="h4 mb-3">{{ titulo }}</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}
    <button class="btn btn-primary">Salvar</button>
    <a class="btn btn-link" href="{% url 'notificacao_lista' %}">Cancelar</a>
  </form>
  {% if obj %}
  <hr>
  <form method="post" action="{% url 'notificacao_excluir' obj.pk %}" onsubmit="return confirm('Excluir esta notificação?')">{% csrf_token %}
    <button class="btn btn-outline-danger btn-sm">Excluir notificação</button>
  </form>
  {% endif %}
</div></div>
{% endblock %}
